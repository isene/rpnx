[package]
name = "rpnx"
version = "0.1.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "RPNx — terminal RPN / XRPN scientific calculator: HP-41CX-style stack, full math/trig/log/stats/base command set, runs XRPN programs. Part of the Fe2O3 suite."
license = "Unlicense"
repository = "https://github.com/isene/rpnx"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
rpnx-core = { version = "0.1", path = "../rpnx-core", package = "fe2o3-rpnx-core" }

[profile.release]
opt-level = 3
lto = true
strip = true
