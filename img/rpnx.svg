<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <radialGradient id="xglow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#f74c00;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#f74c00;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes pulse { 0%,100% { opacity:0.85; } 50% { opacity:1; } }
    .xcell { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- RPN stack display: Z / Y / X registers, X highlighted like a cursor cell -->
  <g transform="translate(56,54)">
    <circle cx="72" cy="52" r="44" fill="url(#xglow)"/>
    <rect x="0" y="0" width="144" height="96" rx="6" fill="#0d0d16" stroke="#f74c00" stroke-width="1.5"/>

    <g font-family="monospace">
      <text x="12" y="19" font-size="10" fill="#9aa">Z</text>
      <text x="132" y="19" font-size="11" fill="#8a8a99" text-anchor="end">0,0000</text>
      <text x="12" y="37" font-size="10" fill="#9aa">Y</text>
      <text x="132" y="37" font-size="11" fill="#dfe0e6" text-anchor="end">2,0000</text>

      <!-- X register: brand highlight -->
      <rect class="xcell" x="6" y="44" width="132" height="22" rx="3" fill="url(#rust)"/>
      <text x="12" y="60" font-size="11" fill="#0a0a14" font-weight="bold">X</text>
      <text x="132" y="60" font-size="13" fill="#0a0a14" text-anchor="end" font-weight="bold">48,6313</text>
    </g>

    <!-- cycling shift pages (f / g / h) + the ':' command palette -->
    <g font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">
      <rect x="8"   y="74" width="28" height="16" rx="3" fill="#e2b714"/>
      <rect x="42"  y="74" width="28" height="16" rx="3" fill="#51afef"/>
      <rect x="76"  y="74" width="28" height="16" rx="3" fill="#4ccc66"/>
      <rect x="110" y="74" width="26" height="16" rx="3" fill="#12121f" stroke="#f74c00" stroke-width="1"/>
      <text x="22"  y="86" fill="#0a0a14">f</text>
      <text x="56"  y="86" fill="#0a0a14">g</text>
      <text x="90"  y="86" fill="#0a0a14">h</text>
      <text x="123" y="86" fill="#f74c00">:</text>
    </g>
  </g>

  <text x="128" y="205" font-family="monospace" font-size="26" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="5">rpnx</text>
  <text x="128" y="223" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">RPN / XRPN calculator</text>
</svg>
